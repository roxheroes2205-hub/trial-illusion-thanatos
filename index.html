<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial Illusion Guild Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #4c1d95 50%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #a78bfa;
        }

        .status {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }

        .controls {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .search-box:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .filter-group select {
            width: 100%;
            padding: 8px 12px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #a78bfa;
        }

        .table-container {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            font-weight: 600;
            color: #a78bfa;
            position: sticky;
            top: 0;
            background: rgba(30, 41, 59, 0.95);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: rgba(30, 41, 59, 1);
        }

        th.sortable::after {
            content: ' ⇅';
            opacity: 0.3;
        }

        th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(71, 85, 105, 0.5);
        }

        tr:hover {
            background: rgba(71, 85, 105, 0.3);
        }

        .center {
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-rank-1 {
            background: rgba(234, 179, 8, 0.3);
            color: #fde047;
        }

        .badge-rank-2 {
            background: rgba(156, 163, 175, 0.3);
            color: #d1d5db;
        }

        .badge-rank-3 {
            background: rgba(205, 127, 50, 0.3);
            color: #fdba74;
        }

        .badge-rank {
            background: rgba(167, 139, 250, 0.2);
            color: #c4b5fd;
        }

        .badge-yes {
            background: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .badge-no {
            background: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .badge-top20 {
            background: rgba(234, 179, 8, 0.4);
            color: #fde047;
            font-weight: bold;
        }

        .badge-obtained {
            background: rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .count {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .text-cell {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Trial Illusion Guild Manager</h1>
            <div class="status" id="status">Loading data...</div>
        </div>

        <div id="error-container"></div>

        <div class="controls">
            <input 
                type="text" 
                id="searchBox" 
                class="search-box" 
                placeholder="Search by name..."
            >

            <div class="filters">
                <div class="filter-group">
                    <label>Filter by Top 20</label>
                    <select id="filterTop20">
                        <option value="">All</option>
                        <option value="Yes">Top 20</option>
                        <option value="No">Not Top 20</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Filter by Rank Range</label>
                    <select id="filterRank">
                        <option value="">All Ranks</option>
                        <option value="1-10">Top 10</option>
                        <option value="11-50">11-50</option>
                        <option value="51-100">51-100</option>
                        <option value="101+">101+</option>
                        <option value="unranked">Unranked</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Has 2 Slot Eyes</label>
                    <select id="filterHasEyes">
                        <option value="">All</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Has 2 Slot Mouth</label>
                    <select id="filterHasMouth">
                        <option value="">All</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Want 2 Slot Eyes</label>
                    <select id="filterWantEyes">
                        <option value="">All</option>
                        <option value="Yes">Yes</option>
                        <option value="Obtained">Obtained</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Want 2 Slot Mouth</label>
                    <select id="filterWantMouth">
                        <option value="">All</option>
                        <option value="Yes">Yes</option>
                        <option value="Obtained">Obtained</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Want Card</label>
                    <select id="filterWantCard">
                        <option value="">All</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="count" id="memberCount">Loading...</div>
            <div id="tableContent">
                <div class="loading">Loading guild members...</div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URLS = [
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6rkDQvBCcrTfU2vQKKZQYkr-lOkK0KvZNsfEMfAtuGo2HxllJ7gcIAlY6Wp-c-WaiHbAe5atE8M4X/pub?output=csv',
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7yYEdRoFayPUvpP678ge6jqk2aGdWlUFFAnFlN5eGo3Y3EcpeNSBMAanL_7IqNUe5gwATBaoQ1eAH/pub?output=csv'
        ];

        // Fallback member data (from first CSV) - includes Stage 2 rewards
        const FALLBACK_MEMBER_DATA = [
            {Members:"Gany",top20:"No",stage1Rank:"37",stage1Points:"248506",mouthHeadgear:"No",mask:"Yes",card:"No"},
            {Members:"Chaz",top20:"No",stage1Rank:"43",stage1Points:"225510",mouthHeadgear:"No",mask:"Yes",card:"No"},
            {Members:"Greydragon",top20:"No",stage1Rank:"30",stage1Points:"288172",mouthHeadgear:"No",mask:"Yes",card:"No"},
            {Members:"Hellesdy",top20:"No",stage1Rank:"30",stage1Points:"288172",mouthHeadgear:"No",mask:"Yes",card:"No"},
            {Members:"Dr Kirby",top20:"No",stage1Rank:"79",stage1Points:"128769",mouthHeadgear:"No",mask:"No",card:"No"},
            {Members:"Hanzo神",top20:"Yes",stage1Rank:"1",stage1Points:"407643",mouthHeadgear:"Yes",mask:"No",card:"No"},
            {Members:"Kayto",top20:"Yes",stage1Rank:"1",stage1Points:"407643",mouthHeadgear:"Yes",mask:"No",card:"No"},
            {Members:"BigMacCombao",top20:"Yes",stage1Rank:"1",stage1Points:"407643",mouthHeadgear:"Yes",mask:"No",card:"No"},
            {Members:"Neige",top20:"No",stage1Rank:"37",stage1Points:"248506",mouthHeadgear:"No",mask:"Yes",card:"No"},
            {Members:"Athena",top20:"No",stage1Rank:"57",stage1Points:"170603",mouthHeadgear:"No",mask:"No",card:"No"}
        ];

        // Fallback survey data (from second CSV)
        const FALLBACK_SURVEY_DATA = [
            {"What is your in-game Name?":"Greydragon","Do you have 2 slot headgear currently?":"2 slot eyes","What items do you want out of TI?":"2 slot mouth","Any more additional notes?":"May the odds be ever in your favor"},
            {"What is your in-game Name?":"Hellesdy","Do you have 2 slot headgear currently?":"2 slot eyes","What items do you want out of TI?":"2 slot mouth","Any more additional notes?":"Curry me thanks!"},
            {"What is your in-game Name?":"Dr Kirby","Do you have 2 slot headgear currently?":"None of the above","What items do you want out of TI?":"2 slot eyes, 2 slot mouth","Any more additional notes?":"thx for setting this up! also cool with being lower priority on the carry list"},
            {"What is your in-game Name?":"Neige","Do you have 2 slot headgear currently?":"2 slot eyes, 2 slot mouth","What items do you want out of TI?":"Costume","Any more additional notes?":"I can switch to any support role if needed."},
            {"What is your in-game Name?":"Chaz","Do you have 2 slot headgear currently?":"2 slot eyes, 2 slot mouth","What items do you want out of TI?":"2 slot eyes, 2 slot mouth","Any more additional notes?":""},
            {"What is your in-game Name?":"Athena","Do you have 2 slot headgear currently?":"None of the above","What items do you want out of TI?":"2 slot eyes, 2 slot mouth, Card album","Any more additional notes?":""},
            {"What is your in-game Name?":"Hanzo神","Do you have 2 slot headgear currently?":"2 slot eyes","What items do you want out of TI?":"2 slot mouth, Card album","Any more additional notes?":"Top DPS"},
            {"What is your in-game Name?":"Kayto","Do you have 2 slot headgear currently?":"None of the above","What items do you want out of TI?":"2 slot eyes, 2 slot mouth","Any more additional notes?":""},
            {"What is your in-game Name?":"BigMacCombao","Do you have 2 slot headgear currently?":"2 slot eyes, 2 slot mouth","What items do you want out of TI?":"2 slot eyes, 2 slot mouth, Card album","Any more additional notes?":"Main tank"}
        ];

        let allMembers = [];
        let filteredMembers = [];
        let sortColumn = 'stage1Rank';
        let sortDirection = 'asc';

        // Parse CSV data with support for quoted fields
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) return [];

            // Parse header
            const headers = parseCSVLine(lines[0]);
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length < 2) continue;

                const row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index] || '';
                });
                data.push(row);
            }

            return data;
        }

        // Parse a single CSV line handling quotes
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // Merge data from both CSV sources
        function mergeData(memberData, surveyData) {
            // Debug: Show what columns we have
            if (memberData.length > 0) {
                console.log('Member data columns:', Object.keys(memberData[0]));
            }
            if (surveyData.length > 0) {
                console.log('Survey data columns:', Object.keys(surveyData[0]));
            }
            
            const surveyMap = {};
            surveyData.forEach(row => {
                const name = row['What is your in-game Name?'];
                if (name) {
                    surveyMap[name] = row;
                }
            });

            return memberData.map(member => {
                const memberName = member.Members || member.Name || member.name || member.Member;
                const survey = surveyMap[memberName] || {};
                
                // Parse what they currently have BEFORE Stage 2 (from survey)
                const currentlyHas = survey['Do you have 2 slot headgear currently?'] || '';
                const hasEyes = currentlyHas.includes('2 slot eyes') ? 'Yes' : 'No';
                const hasMouth = currentlyHas.includes('2 slot mouth') ? 'Yes' : 'No';
                
                // Parse what they EARNED from Stage 2 (from member CSV)
                const earnedMouth = member.mouthHeadgear === 'Yes';
                const earnedEyes = member.mask === 'Yes';
                const earnedCard = member.card === 'Yes';
                
                // Parse what they want from survey
                const wantItems = survey['What items do you want out of TI?'] || '';
                const wantEyes = wantItems.includes('2 slot eyes');
                const wantMouth = wantItems.includes('2 slot mouth');
                const wantCard = wantItems.includes('Card album');
                
                // Extract other wants (anything that's not the standard items)
                let otherWants = wantItems;
                otherWants = otherWants.replace(/2 slot eyes/gi, '');
                otherWants = otherWants.replace(/2 slot mouth/gi, '');
                otherWants = otherWants.replace(/Card album/gi, '');
                otherWants = otherWants.replace(/,\s*,/g, ',').replace(/^,\s*|,\s*$/g, '').trim();
                
                return {
                    name: memberName,
                    top20: member.top20 || '',
                    stage1Rank: member.stage1Rank || '',
                    stage1Points: member.stage1Points || '',
                    hasEyes: hasEyes,
                    hasMouth: hasMouth,
                    earnedEyes: earnedEyes,
                    earnedMouth: earnedMouth,
                    earnedCard: earnedCard,
                    wantEyes: wantEyes,
                    wantMouth: wantMouth,
                    wantCard: wantCard,
                    otherWants: otherWants,
                    notes: survey['Any more additional notes?'] || ''
                };
            });
        }

        // Fetch data from Google Sheets
        async function fetchData() {
            const statusEl = document.getElementById('status');
            const errorContainer = document.getElementById('error-container');
            
            let memberData = [];
            let surveyData = [];
            let errors = [];

            try {
                statusEl.textContent = 'Fetching member data...';
                const response1 = await fetch(CSV_URLS[0]);
                if (!response1.ok) throw new Error(`HTTP error! status: ${response1.status}`);
                const csvText1 = await response1.text();
                memberData = parseCSV(csvText1);
            } catch (error) {
                console.error('Error fetching member data:', error);
                errors.push(`Member data: ${error.message}`);
            }

            try {
                statusEl.textContent = 'Fetching survey data...';
                const response2 = await fetch(CSV_URLS[1]);
                if (!response2.ok) throw new Error(`HTTP error! status: ${response2.status}`);
                const csvText2 = await response2.text();
                surveyData = parseCSV(csvText2);
            } catch (error) {
                console.error('Error fetching survey data:', error);
                errors.push(`Survey data: ${error.message}`);
            }

            // Use fallback data if fetch fails
            if (memberData.length === 0) {
                errorContainer.innerHTML = '<div class="error">Failed to fetch data from Google Sheets. Using fallback data for demonstration.</div>';
                statusEl.textContent = 'Using fallback data';
                memberData = FALLBACK_MEMBER_DATA;
                surveyData = FALLBACK_SURVEY_DATA;
            } else if (errors.length > 0) {
                errorContainer.innerHTML = `<div class="error">Some data failed to load: ${errors.join(', ')}</div>`;
                statusEl.textContent = 'Partial data loaded';
            } else {
                statusEl.textContent = 'Data loaded successfully';
            }

            return mergeData(memberData, surveyData);
        }

        // Get rank badge class
        function getRankBadgeClass(rank) {
            const r = parseInt(rank);
            if (isNaN(r) || !rank) return '';
            if (r === 1) return 'badge-rank-1';
            if (r >= 2 && r <= 3) return 'badge-rank-2';
            if (r >= 4 && r <= 10) return 'badge-rank-3';
            return 'badge-rank';
        }

        // Format want field - shows (Obtained) if they wanted it AND earned it from Stage 2
        function formatWantField(wants, earned) {
            if (!wants) return '<span class="badge badge-no">No</span>';
            if (earned) {
                return '<span class="badge badge-obtained">(Obtained)</span>';
            }
            return '<span class="badge badge-yes">Yes</span>';
        }

        // Sort members
        function sortMembers(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            filteredMembers.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];

                // Handle numeric columns
                if (column === 'stage1Rank' || column === 'stage1Points') {
                    aVal = parseInt(aVal) || Infinity;
                    bVal = parseInt(bVal) || Infinity;
                } else if (typeof aVal === 'boolean') {
                    aVal = aVal ? 1 : 0;
                    bVal = bVal ? 1 : 0;
                } else {
                    // Handle string columns
                    aVal = (aVal || '').toString().toLowerCase();
                    bVal = (bVal || '').toString().toLowerCase();
                }

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderTable();
        }

        // Render table
        function renderTable() {
            const tableContent = document.getElementById('tableContent');
            const memberCount = document.getElementById('memberCount');
            
            memberCount.textContent = `Showing ${filteredMembers.length} of ${allMembers.length} members`;

            if (filteredMembers.length === 0) {
                tableContent.innerHTML = '<div class="loading">No members match the current filters.</div>';
                return;
            }

            const getSortClass = (column) => {
                if (sortColumn === column) {
                    return sortDirection === 'asc' ? 'sort-asc' : 'sort-desc';
                }
                return 'sortable';
            };

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th class="${getSortClass('name')}" onclick="sortMembers('name')">Name</th>
                            <th class="${getSortClass('top20')} center" onclick="sortMembers('top20')">Top 20</th>
                            <th class="${getSortClass('stage1Rank')} center" onclick="sortMembers('stage1Rank')">Rank</th>
                            <th class="${getSortClass('stage1Points')} center" onclick="sortMembers('stage1Points')">Points</th>
                            <th class="${getSortClass('hasEyes')} center" onclick="sortMembers('hasEyes')">Has Eyes</th>
                            <th class="${getSortClass('hasMouth')} center" onclick="sortMembers('hasMouth')">Has Mouth</th>
                            <th class="${getSortClass('wantEyes')} center" onclick="sortMembers('wantEyes')">Want Eyes</th>
                            <th class="${getSortClass('wantMouth')} center" onclick="sortMembers('wantMouth')">Want Mouth</th>
                            <th class="${getSortClass('wantCard')} center" onclick="sortMembers('wantCard')">Want Card</th>
                            <th class="${getSortClass('otherWants')}" onclick="sortMembers('otherWants')">Other Wants</th>
                            <th class="${getSortClass('notes')}" onclick="sortMembers('notes')">Notes</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filteredMembers.forEach(member => {
                const rankBadgeClass = getRankBadgeClass(member.stage1Rank);
                
                html += `
                    <tr>
                        <td><strong>${member.name}</strong></td>
                        <td class="center">${member.top20 && member.top20.toLowerCase() === 'yes' ? '<span class="badge badge-top20">Top 20</span>' : '-'}</td>
                        <td class="center">${member.stage1Rank ? `<span class="badge ${rankBadgeClass}">#${member.stage1Rank}</span>` : '-'}</td>
                        <td class="center">${member.stage1Points ? parseInt(member.stage1Points).toLocaleString() : '-'}</td>
                        <td class="center">${member.hasEyes === 'Yes' ? '<span class="badge badge-yes">Yes</span>' : '<span class="badge badge-no">No</span>'}</td>
                        <td class="center">${member.hasMouth === 'Yes' ? '<span class="badge badge-yes">Yes</span>' : '<span class="badge badge-no">No</span>'}</td>
                        <td class="center">${formatWantField(member.wantEyes, member.earnedEyes)}</td>
                        <td class="center">${formatWantField(member.wantMouth, member.earnedMouth)}</td>
                        <td class="center">${member.wantCard ? '<span class="badge badge-yes">Yes</span>' : '<span class="badge badge-no">No</span>'}</td>
                        <td class="text-cell" title="${member.otherWants}">${member.otherWants || '-'}</td>
                        <td class="text-cell" title="${member.notes}">${member.notes || '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            tableContent.innerHTML = html;
        }

        // Apply filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filterTop20 = document.getElementById('filterTop20').value;
            const filterRank = document.getElementById('filterRank').value;
            const filterHasEyes = document.getElementById('filterHasEyes').value;
            const filterHasMouth = document.getElementById('filterHasMouth').value;
            const filterWantEyes = document.getElementById('filterWantEyes').value;
            const filterWantMouth = document.getElementById('filterWantMouth').value;
            const filterWantCard = document.getElementById('filterWantCard').value;

            filteredMembers = allMembers.filter(member => {
                // Search filter
                if (searchTerm) {
                    const matchesName = member.name.toLowerCase().includes(searchTerm);
                    if (!matchesName) return false;
                }

                // Top 20 filter
                if (filterTop20) {
                    if (filterTop20 === 'Yes' && member.top20.toLowerCase() !== 'yes') return false;
                    if (filterTop20 === 'No' && member.top20.toLowerCase() === 'yes') return false;
                }

                // Rank filter
                if (filterRank) {
                    const rank = parseInt(member.stage1Rank);
                    if (filterRank === 'unranked' && member.stage1Rank) return false;
                    if (filterRank === '1-10' && (isNaN(rank) || rank < 1 || rank > 10)) return false;
                    if (filterRank === '11-50' && (isNaN(rank) || rank < 11 || rank > 50)) return false;
                    if (filterRank === '51-100' && (isNaN(rank) || rank < 51 || rank > 100)) return false;
                    if (filterRank === '101+' && (isNaN(rank) || rank < 101)) return false;
                }

                // Has filters
                if (filterHasEyes && member.hasEyes !== filterHasEyes) return false;
                if (filterHasMouth && member.hasMouth !== filterHasMouth) return false;

                // Want filters with Obtained option (based on Stage 2 rewards earned)
                if (filterWantEyes) {
                    if (filterWantEyes === 'Yes' && (!member.wantEyes || member.earnedEyes)) return false;
                    if (filterWantEyes === 'Obtained' && !(member.wantEyes && member.earnedEyes)) return false;
                    if (filterWantEyes === 'No' && member.wantEyes) return false;
                }
                if (filterWantMouth) {
                    if (filterWantMouth === 'Yes' && (!member.wantMouth || member.earnedMouth)) return false;
                    if (filterWantMouth === 'Obtained' && !(member.wantMouth && member.earnedMouth)) return false;
                    if (filterWantMouth === 'No' && member.wantMouth) return false;
                }
                if (filterWantCard) {
                    if (filterWantCard === 'Yes' && !member.wantCard) return false;
                    if (filterWantCard === 'No' && member.wantCard) return false;
                }

                return true;
            });

            sortMembers(sortColumn);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('filterTop20').addEventListener('change', applyFilters);
        document.getElementById('filterRank').addEventListener('change', applyFilters);
        document.getElementById('filterHasEyes').addEventListener('change', applyFilters);
        document.getElementById('filterHasMouth').addEventListener('change', applyFilters);
        document.getElementById('filterWantEyes').addEventListener('change', applyFilters);
        document.getElementById('filterWantMouth').addEventListener('change', applyFilters);
        document.getElementById('filterWantCard').addEventListener('change', applyFilters);

        // Make sortMembers available globally
        window.sortMembers = sortMembers;

        // Initialize
        async function init() {
            allMembers = await fetchData();
            filteredMembers = [...allMembers];
            sortMembers('stage1Rank'); // Default sort by rank
        }

        init();
    </script>
</body>
